<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='add_new_service.css') }}?v=2">
    <title>Add Service</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}?v=1">
</head>
<body>
    <div class="background-blobs"></div>

    <main class="services-wrapper">
        <section class="services-card add-service-card">
            <div class="services-header">
                <div class="title-with-back">
                    <a href="{{ url_for('services') }}" class="back-btn" aria-label="Back to services">
                        <i class="fas fa-arrow-left"></i>
                    </a>
                    <h2>Add New Service</h2>
                </div>
            </div>

            <form method="POST" class="service-form">
                <label for="name" id="nameLabel">Service Name</label>
                <input type="text" id="name" name="name" placeholder="Service Name" required>

                <label for="type">Type</label>
                <select id="type" name="type" required>
                    <option value="test">Test</option>
                    <option value="doctor">Doctor</option>
                </select>

                <div class="test-fields" id="testFields">
                    <div class="field-group">
                        <label for="sample_type">Sample Type</label>
                        <input type="text" id="sample_type" name="sample_type" placeholder="e.g. Blood, Serum, Urine">
                    </div>
                    <div class="field-group">
                        <label for="test_category">Test Category</label>
                        <input type="text" id="test_category" name="test_category" placeholder="e.g. Hematology">
                    </div>
                    <div class="field-group">
                        <label for="unit">Unit</label>
                        <input type="text" id="unit" name="unit" placeholder="e.g. g/dL, mg/dL">
                    </div>
                    <div class="field-group full-width">
                        <label for="reference_ranges">Reference Ranges</label>
                        <textarea id="reference_ranges" name="reference_ranges" rows="3" placeholder="e.g. Male: 13–17 g/dL; Female: 12–15 g/dL"></textarea>
                    </div>
                </div>

                <label for="price">Price</label>
                <input type="text" id="price" name="price" placeholder="Price" required>

                <div class="form-actions">
                    <button type="submit" class="action-btn">Add Service</button>
                </div>
            </form>

            {% if error %}
            <p class="error-message">{{ error }}</p>
            {% endif %}
        </section>
    </main>
    <script>
    const typeSelect = document.getElementById('type');
    const testFields = document.getElementById('testFields');
    const testInputs = [...testFields.querySelectorAll('input, textarea')];
    function updateServiceFields() {
        const isTest = typeSelect.value === 'test';
        testFields.hidden = !isTest;
        testInputs.forEach(input => input.required = isTest);
        document.getElementById('nameLabel').textContent = isTest ? 'Test Name' : 'Service Name';
        document.getElementById('name').placeholder = isTest ? 'Test Name' : 'Service Name';
    }
    typeSelect.addEventListener('change', updateServiceFields);
    updateServiceFields();
    </script>
</body>
</html>
